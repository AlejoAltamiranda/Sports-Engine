name: Sports Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  test-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
    
    - name: Ejecutar scraper
      id: scraper
      run: |
        echo "Ejecutando scraper..."
        python scraper.py || echo "Scraper termino con errores"
        if [ -f scraper_output.json ]; then
          echo "scraper_output.json generado"
          count=$(python -c "import json; print(len(json.load(open('scraper_output.json'))))" 2>/dev/null || echo "0")
          echo "Partidos crudos: $count"
          echo "count=$count" >> $GITHUB_OUTPUT
        else
          echo "scraper_output.json no generado"
          echo "count=0" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: Ejecutar engine
      id: engine
      run: |
        echo "Normalizando partidos..."
        python engine.py batch || echo "Engine termino con errores"
        if [ -f matches.json ]; then
          echo "matches.json generado"
          count=$(python -c "import json; print(len(json.load(open('matches.json'))))" 2>/dev/null || echo "0")
          echo "Partidos unificados: $count"
          echo "count=$count" >> $GITHUB_OUTPUT
        else
          echo "matches.json no generado"
          echo "count=0" >> $GITHUB_OUTPUT
        fi
    
    - name: Verificar cambios
      id: changes
      run: |
        git add scraper_output.json matches.json 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "No hay cambios en los archivos"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Hay cambios detectados"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          git diff --cached --stat
        fi
    
    - name: Commit y push si hay cambios
      if: github.event_name != 'pull_request' && steps.changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git pull --rebase origin main
        
        git add scraper_output.json matches.json
        
        git commit -m "Actualizar datos de partidos [skip ci]"
        
        git push origin main
        
        echo "Cambios subidos al repositorio"
    
    - name: Mostrar estadisticas
      if: always()
      run: |
        echo "ESTADISTICAS DE DATOS"
        echo "========================"
        if [ -f matches.json ]; then
          echo "Archivos generados:"
          ls -lh *.json 2>/dev/null || echo "No hay JSONs"
          echo ""
          echo "Resumen de partidos:"
          python << 'EOF'
import json
from collections import Counter

try:
    with open('matches.json') as f:
        data = json.load(f)
    
    print(f'Total partidos: {len(data)}')
    
    total_canales = sum(len(m.get('canales', [])) for m in data)
    print(f'Total canales: {total_canales}')
    
    deportes = Counter(m.get('sport', 'soccer') for m in data)
    for sport, count in deportes.most_common():
        print(f'  {sport}: {count} partidos')
    
    estados = Counter(m.get('status', 'unknown') for m in data)
    if estados:
        print('Estados:')
        for status, count in estados.most_common():
            print(f'  {status}: {count}')
            
except Exception as e:
    print(f'Error al leer matches.json: {e}')
EOF
        else
          echo "matches.json no disponible"
        fi
