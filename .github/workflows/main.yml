name: Sports Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  test-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
    
    - name: Ejecutar scraper
      id: scraper
      run: |
        python scraper.py
        echo "count=$(python -c 'import json; print(len(json.load(open("scraper_output.json"))))')" >> $GITHUB_OUTPUT
    
    - name: Ejecutar engine
      id: engine
      run: |
        python engine.py batch
        echo "count=$(python -c 'import json; print(len(json.load(open("matches.json"))))')" >> $GITHUB_OUTPUT
    
    - name: Verificar cambios
      id: changes
      run: |
        if [ -f scraper_output.json ] && [ -f matches.json ]; then
          git add scraper_output.json matches.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit y push
      if: github.event_name != 'pull_request' && steps.changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git stash
        git pull --rebase origin main
        git stash pop
        git add scraper_output.json matches.json
        git commit -m "Actualizar datos de partidos [skip ci]"
        git push origin main
